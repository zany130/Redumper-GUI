name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REDUMPER_VERSION: b750

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            output_os: Windows
            arch: x64
          # Windows arm64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            output_os: Windows
            arch: arm64
          # Windows x86
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows
            output_os: Windows
            arch: x86
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            output_os: Linux
            arch: x64
          # Linux arm64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            output_os: Linux
            arch: arm64
          # macOS x64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos
            output_os: macOS
            arch: x64
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            output_os: macOS
            arch: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p bundle
          curl -L -o redumper.zip "https://github.com/superg/redumper/releases/download/${{ env.REDUMPER_VERSION }}/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          unzip redumper.zip -d redumper_tmp/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp redumper_tmp/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/bin/redumper.exe bundle/
            cp target/${{ matrix.target }}/release/redumper-gui.exe bundle/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            contents="bundle/Redumper GUI.app/Contents"
            mkdir -p "$contents/MacOS" "$contents/lib" "$contents/Resources"
            cp assets/icon/icon.icns "$contents/Resources/"
            cp Info.plist "$contents/"
            cp target/${{ matrix.target }}/release/redumper-gui "$contents/MacOS/"
            cp redumper_tmp/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/bin/redumper "$contents/MacOS/"
            cp -R redumper_tmp/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/lib/* "$contents/lib/"
            chmod +x "$contents/MacOS/redumper-gui" "$contents/MacOS/redumper"
            codesign --force --deep --sign - "bundle/Redumper GUI.app"
            mkdir -p dmg_contents
            mv "bundle/Redumper GUI.app" dmg_contents/
            ln -s /Applications dmg_contents/Applications
            hdiutil create -volname "Redumper GUI" -srcfolder dmg_contents -ov -format UDZO bundle/"Redumper-GUI-${{ matrix.output_os }}-${{ matrix.arch }}.dmg"
            rm -rf dmg_contents
          else
            cp redumper_tmp/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/bin/redumper bundle/
            cp target/${{ matrix.target }}/release/redumper-gui bundle/
            chmod +x bundle/redumper bundle/redumper-gui
          fi

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) ARCH=x86_64 ;;
            arm64) ARCH=aarch64 ;;
            *) echo "Unsupported AppImage arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          export ARCH
          export APPIMAGE_EXTRACT_AND_RUN=1
          export UPDATE_INFORMATION="gh-releases-zsync|Deterous|Redumper-GUI|latest|Redumper-GUI-Linux-${{ matrix.arch }}.AppImage.zsync"

          sudo apt-get update
          sudo apt-get install -y dpkg-dev pkg-config librsvg2-dev gobject-introspection libgdk-pixbuf-2.0-dev

          tools="${RUNNER_TEMP}/linuxdeploy-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-${ARCH}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk.sh" \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x "$tools/linuxdeploy-${ARCH}.AppImage" "$tools/linuxdeploy-plugin-gtk.sh"
          export PATH="$tools:${PATH}"

          work="${RUNNER_TEMP}/appimage-build"
          mkdir -p "$work/AppDir/usr/bin" \
            "$work/AppDir/usr/share/metainfo" \
            "$work/AppDir/usr/share/icons/hicolor/512x512/apps"
          curl -fsSL -o redumper.zip \
            "https://github.com/superg/redumper/releases/download/${{ env.REDUMPER_VERSION }}/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          rm -rf redumper_appimage_tmp
          unzip redumper.zip -d redumper_appimage_tmp/
          cp "target/${{ matrix.target }}/release/redumper-gui" "$work/AppDir/usr/bin/"
          cp "redumper_appimage_tmp/redumper-${{ env.REDUMPER_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/bin/redumper" "$work/AppDir/usr/bin/"
          chmod +x "$work/AppDir/usr/bin/redumper-gui" "$work/AppDir/usr/bin/redumper"
          cp packaging/appimage/com.redumper.gui.metainfo.xml "$work/AppDir/usr/share/metainfo/"
          cp assets/icon/icon.png "$work/AppDir/usr/share/icons/hicolor/512x512/apps/com.redumper.gui.png"
          cp assets/icon/icon.png "$work/com.redumper.gui.png"

          plugin_args=()
          # rfd's default Linux backend talks to xdg-desktop-portal and does not link GTK.
          # Bundle GTK only when this build actually links libgtk-3.
          if ldd "$work/AppDir/usr/bin/redumper-gui" | grep -q 'libgtk-3\.so'; then
            plugin_args+=(--plugin gtk)
            export DEPLOY_GTK_VERSION=3
          fi

          mkdir -p appimage
          (
            cd appimage
            export OUTPUT="Redumper-GUI-Linux-${{ matrix.arch }}.AppImage"
            linuxdeploy-${ARCH}.AppImage \
              --appdir "$work/AppDir" \
              --desktop-file "$GITHUB_WORKSPACE/packaging/appimage/com.redumper.gui.desktop" \
              --icon-file "$work/com.redumper.gui.png" \
              "${plugin_args[@]}" \
              --output appimage
          )
          image="appimage/Redumper-GUI-Linux-${{ matrix.arch }}.AppImage"
          zsync="${image}.zsync"
          if [ ! -s "$image" ] || [ ! -s "$zsync" ]; then
            echo "AppImage packaging did not produce nonempty ${image} and ${zsync}" >&2
            ls -l appimage >&2 || true
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: Redumper-GUI-${{ matrix.output_os }}-${{ matrix.arch }}
          path: bundle/

      - name: Upload AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Redumper-GUI-${{ matrix.output_os }}-${{ matrix.arch }}-AppImage
          path: |
            appimage/*.AppImage
            appimage/*.zsync

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*\"\(.*\)\"/\1/' |  tr -d '\r\n')" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download all artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create release archives
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [[ "$name" == *"AppImage"* ]]; then
              image=("$name"/*.AppImage)
              zsync=("$name"/*.zsync)
              if [ ! -s "${image[0]}" ] || [ ! -s "${zsync[0]}" ]; then
                echo "AppImage artifact $name is missing a nonempty .AppImage or .zsync"
                exit 1
              fi
              cp "${image[0]}" "${zsync[0]}" ../release/
            elif [[ "$name" == *"Linux"* ]]; then
              chmod +x "$name"/redumper "$name"/redumper-gui
              tar -czf "../release/${name}.tar.gz" -C "$name" .
            elif [[ "$name" == *"macOS"* ]]; then
              (cd "$name" && cp ./*.dmg "../../release/${name}.dmg")
            else
              (cd "$name" && zip -r "../../release/${name}.zip" .)
            fi
          done
          if [ -z "$(ls ../release/* 2>/dev/null)" ]; then
            echo "No artifacts to release"
            exit 1
          fi

      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Redumper GUI v${{ steps.version.outputs.version }}
          body: |
            Bundled redumper version: ${{ env.REDUMPER_VERSION }}

            **[Download for Windows (64bit)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/Redumper-GUI-Windows-x64.zip)**

            **[Download for Linux (64bit)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/Redumper-GUI-Linux-x64.tar.gz)**

            **[Download AppImage for Linux (64bit)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/Redumper-GUI-Linux-x64.AppImage)**

            **[Download for macOS (Apple Silicon)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/Redumper-GUI-macOS-arm64.dmg)**

            For other systems, see the downloads below.
          files: release/*
          make_latest: true
